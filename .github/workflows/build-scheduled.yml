name: Gradle Check Scheduled

on:
  schedule:
    - cron: '0 */8 * * *'
  # The documented response to a warning is to pause this workflow, regenerate, review and push.
  # Without a manual trigger the confirming run is up to eight hours away, and the channel stays
  # quiet in the meantime — which is this job's way of saying it did not run. Being able to ask
  # for a run is what keeps that pause short enough to still mean what it says.
  workflow_dispatch:

# Its own group, not build.yml's: concurrency groups are repository-wide, so sharing
# `build-main` let an ordinary push cancel a mid-flight monitor run — swallowing the
# heartbeat digest as a neutral "cancelled" — and let the 8-hour tick cancel a push's
# build. Self-supersession within the monitor is still wanted.
concurrency:
  group: build-scheduled-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - id: setup
        uses: sava-software/sava-build@main
        with:
          default-java-version: ${{ vars.JAVA_VERSION }}
          jdk-src: ${{ vars.JDK_SRC }}
          gradle-java-version: ${{ vars.GRADLE_JAVA_VERSION }}

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        name: Checkout IDL Source Generator
        id: srcgen
        with:
          repository: sava-software/idl-src-gen
          token: ${{ secrets.READ_SAVA_SRC_GEN }}
          path: idl-src-gen

      # genSrc.sh rebuilds the generator whenever its image is older than the sources, so this
      # cannot silently monitor with stale code — an image built before a fix runs, exits zero and
      # writes a report indistinguishable from a correct one.
      #
      # The webhook makes every run report: what moved, or an all-clear naming how many programs
      # and channels were compared. Silence in the channel therefore means this job did not run,
      # never that it ran and found nothing. An undelivered digest fails the step for the same
      # reason — a green run whose alert went nowhere reads as "nothing happened".
      #
      # This job has no write access and never commits, so the committed sources.json it compares
      # against does not advance on its own: a channel that moved is reported again on every run
      # until someone regenerates and pushes. The intended response to a warning is therefore to
      # disable this workflow, regenerate locally, review the diff and push — re-enabling it once
      # the records are current.
      #
      # While it is disabled the channel goes quiet, which otherwise means "the job did not run".
      # That reading is correct here: it did not. Keep the pause short enough that the two cannot
      # be confused, or the heartbeat stops being evidence of anything.
      - name: Generate Source & Check
        run: |
          ./idl-src-gen/genSrc.sh --config="../main_net_programs.json" --rpc="${{ secrets.RPC_URL }}"
          ./gradlew --stacktrace -PjavaVersion=${{ steps.setup.outputs.java-version }} check
        env:
          ORG_GRADLE_PROJECT_savaGithubPackagesUsername: ${{ github.actor }}
          ORG_GRADLE_PROJECT_savaGithubPackagesPassword: ${{ secrets.READ_SAVA_PACKAGES }}
          IDL_SRC_GEN_WEBHOOK: ${{ secrets.IDL_MONITOR_SLACK_WEBHOOK }}

      # The vendored movement-evidence audit (.github/report-evidence.sh, hooks/pre-push) is a
      # byte-copy of idl-src-gen consumer/, which this job has already checked out. Diffed here
      # as well as on push so a canonical change is caught within eight hours even when nothing
      # is being pushed — and *after* the monitor step, so stale tooling reddens the run without
      # silencing the heartbeat digest the step above already delivered. !cancelled(): the
      # eight-hour bound must hold precisely while the monitor step is failing, which is when a
      # channel that moved is re-alerting every run.
      - name: The vendored audit must match the canonical one
        if: ${{ !cancelled() && steps.srcgen.outcome == 'success' }}
        run: |
          status=0
          diff -u idl-src-gen/consumer/report-evidence.sh .github/report-evidence.sh || status=1
          diff -u idl-src-gen/consumer/hooks/pre-push .github/hooks/pre-push || status=1
          if [ "$status" -ne 0 ]; then
            echo "Re-vendor with idl-src-gen/consumer/sync.sh and commit." >&2
          fi
          exit "$status"
